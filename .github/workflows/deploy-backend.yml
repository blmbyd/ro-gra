name: Wdróż backend PHP przez FTP

on:
  push:
    branches:
      - main
    paths:
      - 'backend-php/**'
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Wgraj na serwer przez FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server:     ${{ secrets.FTP_SERVER }}
          username:   ${{ secrets.FTP_USERNAME }}
          password:   ${{ secrets.FTP_PASSWORD }}
          local-dir:  ./backend-php/
          server-dir: /
          protocol:   ftps
          port:       21
          # Nie nadpisuj danych uczestników zebranych na produkcji
          exclude: |
            **/.git*
            **/.git*/**
            **/storage/entries.json
